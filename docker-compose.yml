version: '3.8'

services:
  postgres:
    build:
      context: ./postgresql
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql/lbrp_db.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgresql/custom_entrypoint.sh:/usr/local/bin/custom_entrypoint.sh
    entrypoint: ["/usr/local/bin/custom_entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lbrp-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  patterns:
    build:
      context: ./patterns
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./patterns:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lbrp-network
    restart: always

  hotspots:
    build:
      context: ./hotspots
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./hotspots:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lbrp-network
    restart: always

  pois:
    build:
      context: ./pois
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./pois:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lbrp-network
    restart: always

  future-pois:
    build:
      context: ./future_pois
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./future_pois:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lbrp-network
    restart: always

  models:
    build:
      context: ./models
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./models:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lbrp-network
    restart: on-failure

  considition:
    image: considition/considition2025
    ports:
      - "8080:8080"
    networks:
      - lbrp-network
    restart: unless-stopped

  ev_subscriber:
    build:
      context: ./ev_subscriber
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8082:8082"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      postgres:
        condition: service_healthy
      considition:
        condition: service_started
    networks:
      - lbrp-network
    volumes:
      - ./ev_subscriber:/app
    restart: always

  astar:
    build:
      context: ./astar
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./astar:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lbrp-network
    restart: always

  mapf:
    build:
      context: ./mapf
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./mapf:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lbrp-network
    restart: always

  routing:
    build:
      context: ./routing
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - 8082:8082
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./routing:/app
      - ./saved_models:/app/saved_models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lbrp-network
    restart: always

  routing-planner:
    build:
      context: ./routing_planner
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./routing_planner:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lbrp-network
    restart: always

  uos-api:
    build:
      context: ./uos_api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./uos_api:/app
    ports:
      - "8181:8181"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lbrp-network
    restart: always

networks:
  lbrp-network:
    driver: bridge